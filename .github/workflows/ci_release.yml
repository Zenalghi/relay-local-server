name: ESP32 PlatformIO CI & Firmware Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*' # Trigger otomatis rilis saat push tag, misal: v3.0.1
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # Tombol manual "Run workflow" di web GitHub
    inputs:
      release_tag:
        description: 'Tag / Versi Rilis Firmware (contoh: v3.0.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: ⚡ Compile & Build ESP32 Firmware
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 🛠️ Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: 🔑 Configure secrets.ini from Template
        run: |
          cp secrets.example.ini secrets.ini

      - name: 🏗️ Compile Firmware (esp32doit-devkit-v1)
        run: |
          pio run -e esp32doit-devkit-v1

      - name: 📦 Package Binaries for Easy Flashing
        run: |
          mkdir -p build_output
          cp .pio/build/esp32doit-devkit-v1/firmware.bin build_output/r-sync-firmware.bin
          cp .pio/build/esp32doit-devkit-v1/bootloader.bin build_output/bootloader.bin || true
          cp .pio/build/esp32doit-devkit-v1/partitions.bin build_output/partitions.bin || true
          cd build_output
          zip -r ../r-sync-esp32-binaries.zip .

      - name: 📤 Upload Build Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware-binaries
          path: build_output/

      # ----------------------------------------------------
      # Publikasikan ke GitHub Releases jika dipicu oleh Tag atau Manual Dispatch
      # ----------------------------------------------------
      - name: 🏷️ Check If Release Needed
        id: check_release
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.release_tag }}" != "" ]]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

      - name: 🚀 Publish Firmware to GitHub Releases
        if: steps.check_release.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_release.outputs.tag }}
          name: R-Sync ESP32 Firmware ${{ steps.check_release.outputs.tag }}
          files: |
            build_output/r-sync-firmware.bin
            r-sync-esp32-binaries.zip
          generate_release_notes: true
          draft: false
          prerelease: false
